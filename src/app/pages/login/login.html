<!-- Login Section -->
<section class="login-section">
  <div class="container">
    <div class="row align-items-center g-5">
      <!-- Left -->
      <div class="col-lg-6">
        <div class="login-content">
          <h1>Welcome Back!</h1>
          <p class="mt-3">
            Sign in to continue ordering delicious food from your favourite restaurant branch.
          </p>
          <img src="https://themewagon.github.io/restoran/img/hero.png" class="img-fluid mt-4" alt="Hero Food Plate">
        </div>
      </div>

      <!-- Right -->
      <div class="col-lg-6">
        <div class="card login-card border-0 shadow-lg">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="fas fa-user-circle fa-4x text-warning"></i>
              <h2 class="mt-3">Login</h2>
              <p class="text-muted">
                Access your account
              </p>
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
              <div class="mb-4">
                <label class="form-label" for="email">
                  Email Address
                </label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                  </span>
                  <input type="email"
                         id="email"
                         name="email"
                         class="form-control"
                         placeholder="Enter your email"
                         required
                         email
                         [(ngModel)]="credentials.email"
                         #emailInput="ngModel"
                         [class.is-invalid]="emailInput.invalid && emailInput.touched">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label" for="password">
                  Password
                </label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                  <input type="password"
                         id="password"
                         name="password"
                         class="form-control"
                         placeholder="Enter your password"
                         required
                         [(ngModel)]="credentials.password"
                         #passInput="ngModel"
                         [class.is-invalid]="passInput.invalid && passInput.touched">
                </div>
              </div>

              <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                  <input class="form-check-input"
                         type="checkbox"
                         id="remember"
                         name="remember"
                         [(ngModel)]="credentials.remember">
                  <label class="form-check-label" for="remember">
                    Remember Me
                  </label>
                </div>
                <a href="#" class="text-warning text-decoration-none">
                  Forgot Password?
                </a>
              </div>

              <button class="btn btn-warning w-100 py-3" type="submit" [disabled]="loginForm.invalid">
                Login
              </button>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0">
              Don't have an account?
              <a routerLink="/register" class="text-warning text-decoration-none fw-semibold">
                Register Now
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
