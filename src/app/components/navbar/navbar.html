<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">

        <a class="navbar-brand fw-bold text-warning fs-2" href="#">
            <i class="fas fa-utensils"></i> Beef With Chef Melbin
        </a>

        <button class="navbar-toggler"
            type="button"
            (click)="toggleNavbar()"
            [attr.aria-expanded]="!isCollapsed()"
            aria-controls="navbar"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="!isCollapsed()" id="navbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Branches</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
                </li>

                @if (authService.isAdmin()) {
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-semibold" routerLink="/admin" routerLinkActive="active">Admin</a>
                    </li>
                }

            </ul>

            @if (authService.isLoggedIn()) {
                <button (click)="logout()" class="btn btn-warning ms-lg-4">
                    Logout
                </button>
            } @else {
                <a routerLink="/login" class="btn btn-warning ms-lg-4">
                    Login
                </a>
            }

        </div>

    </div>
</nav>
