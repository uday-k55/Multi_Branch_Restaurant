# ==============================================================================
# Beef With Chef Melbin - Multi-Branch Restaurant Management System
# Local Development Profile Configuration (Profile: local)
# Targets: Local WAMP Server MySQL instance (localhost:3306/restaurant_db)
# ==============================================================================

spring.application.name=restaurant-backend

# --- Local WAMP MySQL Datasource Configuration ---
# Dedicated local environment variables with fallbacks to standard WAMP defaults.
# This prevents silent fallback to remote/production variables (DB_HOST, etc.).
spring.datasource.url=jdbc:mysql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:restaurant_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Local Safety Configuration ---
# STRICT DATA SAFETY: Set ddl-auto to none (or configurable via LOCAL_DDL_AUTO)
# to strictly preserve all existing WAMP tables, schemas, and records without alteration.
spring.jpa.hibernate.ddl-auto=${LOCAL_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Error Handling ---
server.error.include-message=always
server.error.include-binding-errors=always

# --- Local Backend Server Port ---
# Defaults to 8080 (matching local Angular development environment target)
server.port=${LOCAL_PORT:8080}



RISU_API_KEY=${RISU_API_KEY}
RISU_FROM_EMAIL=${RISU_FROM_EMAIL}

RISU_API_URL=https://risumail.risu.in/api/v1/emails
